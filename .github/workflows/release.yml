name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create zips
        run: |
          zip -j martini-skills.zip martini-skills/SKILL.md martini-skills/playbook.md
          zip -j blender-to-martini.zip blender-to-martini/SKILL.md blender-to-martini/export_take.py

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.sha.outputs.short }}
          name: ${{ steps.sha.outputs.short }}
          files: |
            martini-skills.zip
            blender-to-martini.zip
